# ---------------------------------------------------------------------------
# reservation-service runtime configuration (all pods read the same file)
# ---------------------------------------------------------------------------

# --- Shared PostgreSQL primary --------------------------------------------
# DBA-mandated: SET lock_timeout = '50ms' on every connection (INC-2291).
db.lock.wait.timeout.ms=50
# Simulated round trips (pod -> PgBouncer -> primary)
db.statement.latency.micros=300
db.commit.latency.micros=500

# --- Downstream systems ---------------------------------------------------
payment.latency.min.ms=3
payment.latency.max.ms=6
eventbus.latency.ms=1

# --- Deployment -----------------------------------------------------------
# Horizontal pod autoscaler min replicas
cluster.nodes=3

# --- Reservation path (ADR-007) -------------------------------------------
reservation.locking.strategy=fenced
slot.bucket.minutes=15
retry.max.retries=2
retry.backoff.base.ms=2
retry.backoff.max.ms=20
retry.client.retry-after.ms=200
